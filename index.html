<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-ATLAS Hausa Business Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      margin: 0;
      padding: 20px;
      color: #183b2b;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 { color: #087443; }
    
    textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea, select {
      border: 1px solid #bbb;
    }

    textarea { min-height: 120px; }

    button {
      background: #087443;
      color: white;
      border: none;
      font-weight: bold;
    }

    #answer {
      background: #eaf6ee;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>🇳🇬 N-ATLAS Business Assistant</h1>
    <p>Your assistant for local business in Nigeria.</p>

    <label for="language">Choose language / Zaɓi harshe</label>
    <select id="language">
      <option value="ha">Hausa</option>
      <option value="en">English</option>
    </select>

    <label for="question">Write your business question / Rubuta tambayarka</label>
    <textarea id="question" placeholder="Misali: Ta yaya zan inganta kasuwancin kayan babur?"></textarea>

    <button onclick="getAnswer()">Get Help / Nemi Taimako</button>

    <h3>Answer / Amsa</h3>
    <div id="answer">Amsarka za ta bayyana a nan.</div>

    <footer>
      Prototype by Abbas | N-ATLAS integration is not yet connected.
    </footer>
  </main>

  <script>
    function getAnswer() {
      const language = document.getElementById("language").value;
      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");

      if (!question) {
        answer.textContent = language === "ha"
          ? "Don Allah, ka rubuta tambayarka tukuna."
          : "Please enter your question first.";
        return;
      }

      answer.textContent = language === "ha"
        ? "Na karɓi tambayarka: " + question +
          "\n\nWannan samfurin gwaji ne. Har yanzu ba a haɗa shi da N-ATLAS AI ba."
        : "Your question: " + question +
          "\n\nThis is a prototype. N-ATLAS AI has not been connected yet.";
    }
  </script>
</body>
</html>
